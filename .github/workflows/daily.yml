name: daily-arxiv-watch

on:
  workflow_dispatch:
  schedule:
    # 23:10 UTC = 08:10 JST
    - cron: "10 23 * * *"

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[llm]"

      - name: Run arxiv-watcher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          arxiv-watcher init
          arxiv-watcher run --config config/queries.yaml

      - name: Build GitHub Pages site
        run: |
          python scripts/build_pages.py

      - name: Commit and push reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/*.md docs
          git diff --cached --quiet || git commit -m "📄 Daily arXiv digest $(date +%Y-%m-%d)"
          git push

      - name: Post Japanese digest to Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set. Skipping Discord notification."
            exit 0
          fi
          python scripts/post_to_discord.py --timezone Asia/Tokyo --max-papers 10
